<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - Smart Gym</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="dashboard.html" class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="color: var(--secondary-color);">
          <line x1="18" y1="20" x2="18" y2="10"></line>
          <line x1="12" y1="20" x2="12" y2="4"></line>
          <line x1="6" y1="20" x2="6" y2="14"></line>
        </svg>
        SmartGym <span>Telemetry</span>
      </a>
      <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="history.html">History</a>
        <a href="analytics.html">Analytics</a>
        <a href="profile.html" class="active">Profile</a>
      </nav>
      <div class="user-badge">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        User: <strong id="username-display">Loading...</strong>
        <button id="logout-btn" class="btn-logout" title="Log Out">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <div class="container" style="max-width: 600px;">
    <div class="glass-panel">
      <div style="margin-bottom: 25px;">
        <h2>User Settings Profile</h2>
        <p style="font-size: 14px; color: var(--text-secondary); margin-top: 4px;">Update your physiological and telemetry parameters</p>
      </div>

      <div id="profile-alerts"></div>

      <form id="profile-form">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="profile-username" class="form-input" disabled style="background: rgba(255, 255, 255, 0.01); color: var(--text-secondary);">
          <small style="font-size: 11px; color: var(--text-secondary); display: block; margin-top: 4px;">Username cannot be modified.</small>
        </div>

        <div class="form-group">
          <label for="profile-email">Email Address</label>
          <input type="email" id="profile-email" class="form-input" required>
        </div>

        <div class="profile-grid">
          <div class="form-group">
            <label for="profile-weight">Body Weight (kg)</label>
            <input type="number" id="profile-weight" class="form-input" required min="1" step="0.5">
          </div>

          <div class="form-group">
            <label for="profile-target">Daily Burn Target (kcal)</label>
            <input type="number" id="profile-target" class="form-input" required min="10" step="10">
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 15px;">
          Update Settings
        </button>
      </form>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('gym_token');
    const username = localStorage.getItem('gym_username') || 'Guest';

    if (!token) {
      window.location.href = '/login.html';
    }

    document.getElementById('username-display').textContent = username;

    document.getElementById('logout-btn').addEventListener('click', () => {
      localStorage.removeItem('gym_token');
      localStorage.removeItem('gym_username');
      window.location.href = '/login.html';
    });

    async function loadProfile() {
      try {
        const response = await fetch('/api/profile', {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (!response.ok) throw new Error('Failed to retrieve profile data');

        const profile = await response.json();
        
        document.getElementById('profile-username').value = profile.username;
        document.getElementById('profile-email').value = profile.email || '';
        document.getElementById('profile-weight').value = profile.weight_kg || 75;
        document.getElementById('profile-target').value = profile.target_calories || 500;
      } catch (err) {
        document.getElementById('profile-alerts').innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
      }
    }

    document.getElementById('profile-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const alerts = document.getElementById('profile-alerts');
      alerts.innerHTML = '';

      const email = document.getElementById('profile-email').value.trim();
      const weight_kg = parseFloat(document.getElementById('profile-weight').value);
      const target_calories = parseInt(document.getElementById('profile-target').value, 10);

      try {
        const response = await fetch('/api/profile', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ email, weight_kg, target_calories })
        });

        if (!response.ok) throw new Error('Failed to save profile changes');

        alerts.innerHTML = `<div class="alert alert-success">Profile changes saved successfully!</div>`;
      } catch (err) {
        alerts.innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
      }
    });

    loadProfile();
  </script>
</body>
</html>
